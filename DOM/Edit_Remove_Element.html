<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
  // adding the element in the html or dom 
   function addLang(langName){
      const li = document.createElement('li')
      const addText = document.createTextNode(langName)
      li.appendChild(addText)
      document.querySelector('.language').appendChild(li)
   }

   addLang("Python")
   addLang("Java")

   // edit the element 

   const secondlang = document.querySelector('li:nth-child(2)')
   const li = document.createElement('li')
   li.textContent = 'Ruby'
   secondlang.replaceWith(li)

   const firstlang = document.querySelector('li:nth-child(1)')
   firstlang.outerHTML =' <li>Python</li> '

   // remove 

   const firstchild = document.querySelector('li:nth-child(1)')
   firstchild.remove()
